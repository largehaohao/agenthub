name: AgentHub
options:
  minimumXcodeGenVersion: 2.45.4
  deploymentTarget:
    macOS: "14.0"
packages:
  AgentHubPackage:
    path: .
settings:
  base:
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  AgentHubApp:
    type: application
    platform: macOS
    sources:
      - App
      - path: Support/com.agenthub.daemon.plist
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.agenthub.app
        CODE_SIGN_ENTITLEMENTS: Config/AgentHubApp.entitlements
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - package: AgentHubPackage
        product: AgentHubCore
      - package: AgentHubPackage
        product: AgentHubIPC
      - package: AgentHubPackage
        product: AgentHubSecurity
    postBuildScripts:
      - name: Embed helpers
        script: |
          set -euo pipefail
          if [[ "$CONFIGURATION" == "Release" ]]; then
            SWIFT_CONFIGURATION="release"
          else
            SWIFT_CONFIGURATION="debug"
          fi
          for PRODUCT in agenthubd agenthub-claude-hook; do
            xcrun swift build \
              --package-path "$SRCROOT" \
              --product "$PRODUCT" \
              --configuration "$SWIFT_CONFIGURATION"
          done
          HELPER_DIR="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers"
          mkdir -p "$HELPER_DIR"
          for PRODUCT in agenthubd agenthub-claude-hook; do
            install -m 700 \
              "$SRCROOT/.build/$SWIFT_CONFIGURATION/$PRODUCT" \
              "$HELPER_DIR/$PRODUCT"
          done
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/agenthubd
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/agenthub-claude-hook
        basedOnDependencyAnalysis: false
  AgentHubAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/AgentHubAppTests
    dependencies:
      - target: AgentHubApp
      - package: AgentHubPackage
        product: AgentHubCore
      - package: AgentHubPackage
        product: AgentHubIPC
      - package: AgentHubPackage
        product: AgentHubSecurity
schemes:
  AgentHubApp:
    build:
      targets:
        AgentHubApp: all
    test:
      targets:
        - AgentHubAppTests
