name: AgentHub
options:
  minimumXcodeGenVersion: 2.45.4
  deploymentTarget:
    macOS: "14.0"
packages:
  AgentHubPackage:
    path: .
settings:
  base:
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  AgentHubApp:
    type: application
    platform: macOS
    sources:
      - App
    resources:
      - App/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.agenthub.app
        CODE_SIGN_ENTITLEMENTS: Config/AgentHubApp.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: AgentHubPackage
        product: AgentHubQuota
  AgentHubAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/AgentHubAppTests
    dependencies:
      - target: AgentHubApp
      - package: AgentHubPackage
        product: AgentHubQuota
schemes:
  AgentHubApp:
    build:
      targets:
        AgentHubApp: all
    test:
      targets:
        - AgentHubAppTests
